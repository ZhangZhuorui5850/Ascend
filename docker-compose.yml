services:
  app:
    build: .
    container_name: ascend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      ZGCA_DATA_ROOT: /app/data
      ZGCA_UPLOAD_ROOT: /app/data/uploads
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups

  caddy:
    image: caddy:2-alpine
    container_name: ascend-proxy
    profiles:
      - proxy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
