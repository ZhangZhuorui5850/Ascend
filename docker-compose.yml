services:
  zgca-workbench:
    build: .
    container_name: zgca-workbench
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      ZGCA_DATA_ROOT: /app/data
      ZGCA_UPLOAD_ROOT: /app/data/uploads
      ZGCA_SOURCE_ROOT: /source
    volumes:
      - ./data:/app/data
      - ..:/source:ro
      - ./backups:/app/backups

  caddy:
    image: caddy:2-alpine
    container_name: zgca-workbench-proxy
    profiles:
      - proxy
    restart: unless-stopped
    depends_on:
      - zgca-workbench
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
