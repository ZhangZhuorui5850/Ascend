services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: zgca-workbench:production
    restart: unless-stopped
    init: true
    user: "1001:1001"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      ZGCA_DATA_ROOT: /app/data
      ZGCA_UPLOAD_ROOT: /app/data/uploads
      ZGCA_BACKUP_ROOT: /app/backups
    expose:
      - "3000"
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    env_file:
      - .env.production
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
