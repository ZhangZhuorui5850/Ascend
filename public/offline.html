<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#b13a20" />
  <title>暂时离线 · 登峰</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
    body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); box-sizing: border-box; background: #f2eee3; color: #262015; }
    main { width: min(640px, 100%); padding: 28px; border: 1px solid #c8bda2; border-radius: 12px; background: #faf7ef; box-shadow: 3px 3px 0 rgba(122,102,70,.13); }
    b { display: grid; place-items: center; width: 48px; height: 48px; margin-bottom: 18px; border-radius: 10px; background: linear-gradient(#f7f3e8, #ece5d2); border: 1px solid #d9d0ba; }
    h1 { margin: 0 0 8px; font-size: 23px; } p { margin: 0 0 20px; color: #6f654f; line-height: 1.7; }
    button { min-height: 44px; padding: 10px 18px; border: 0; border-radius: 8px; background: #b13a20; color: #fff; font: inherit; font-weight: 600; touch-action: manipulation; }
    button[disabled] { opacity: .6; }
    small { display: block; margin-top: 12px; color: #6f654f; }
    .snapshot { display: grid; gap: 12px; margin-top: 24px; padding-top: 20px; border-top: 1px solid #d9d0ba; }
    .snapshot header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .snapshot h2 { margin: 0; font-size: 17px; }
    .snapshot header small { margin: 2px 0 0; text-align: right; }
    .reviewList { display: grid; gap: 9px; }
    .reviewCard { padding: 12px; border: 1px solid #d9d0ba; border-radius: 9px; background: rgba(255,255,255,.36); }
    .reviewCard strong, .reviewCard span { display: block; }
    .reviewCard span { margin-top: 2px; color: #8a7c60; font-size: 12px; }
    .reviewCard p { margin: 10px 0; color: inherit; font-size: 14px; white-space: pre-wrap; }
    details { border-top: 1px dashed #d9d0ba; padding-top: 8px; }
    summary { cursor: pointer; color: #b13a20; font-size: 12px; font-weight: 700; }
    details div { margin-top: 8px; color: #6f654f; font-size: 13px; line-height: 1.65; white-space: pre-wrap; }
    .boundary { padding: 9px 11px; border-radius: 8px; background: rgba(177,58,32,.08); color: #6f654f; font-size: 12px; line-height: 1.6; }
    @media (prefers-color-scheme: dark) { body { background: #1c1710; color: #ece2cc; } main { background: #251f16; border-color: #50442e; } p, small, details div, .boundary { color: #b2a482; } .reviewCard { border-color: #50442e; background: rgba(255,255,255,.03); } .snapshot { border-color: #50442e; } }
  </style>
</head>
<body><main>
  <b aria-hidden><svg viewBox="-10 -10 520 360" width="34" height="24"><path d="M16,332 L248,0 L480,332 Z" fill="#262015"/><path d="M248,0 L192,108 L248,84 L304,108 Z" fill="#faf7ef"/><path d="M140,332 L216,240 L180,220 L248,128 L248,84" fill="none" stroke="#b13a20" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/></svg></b>
  <h1>现在无法连接</h1>
  <p>无法连接服务器。若这台设备此前打开过今日复习，下面会显示最近一次本机快照。</p>
  <button type="button" onclick="reconnect()">重新连接</button>
  <small hidden id="hint">仍然连不上，请检查网络后再试。</small>
  <section class="snapshot" hidden id="snapshot">
    <header><div><h2>本机复习快照</h2><small id="snapshotMeta"></small></div><small id="pendingMeta"></small></header>
    <div class="boundary">只读恢复：可以先独立作答并展开核对答案；为避免丢失真实尝试证据，此离线壳不提交评分。已打开的完整今日复习页仍支持离线评分与联网补传。</div>
    <div class="reviewList" id="reviewList"></div>
  </section>
  <script>
    // 自愈：页面级 fetch 能通而导航仍落到本页，说明是 Service Worker 层卡死
    //（典型场景：自签证书轮换后，SW 的 fetch 不继承手动信任，全部被拒）。
    // 此时卸载 SW、清掉缓存再直连，浏览器主线程的请求就能正常放行。
    async function reconnect() {
      var btn = document.querySelector("button");
      var hint = document.getElementById("hint");
      btn.disabled = true; btn.textContent = "正在重试…"; hint.hidden = true;
      var networkOk = false;
      try { await fetch("/api/health", { cache: "no-store" }); networkOk = true; } catch (e) {}
      if (networkOk) {
        try {
          if ("serviceWorker" in navigator) {
            var regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(function (r) { return r.unregister(); }));
          }
          if (window.caches) {
            var keys = await caches.keys();
            await Promise.all(keys.map(function (k) { return caches.delete(k); }));
          }
        } catch (e) {}
        location.replace("/");
        return;
      }
      btn.disabled = false; btn.textContent = "重新连接"; hint.hidden = false;
    }
    window.addEventListener("online", function () { reconnect(); });

    async function loadSnapshot() {
      if (!window.indexedDB) return;
      try {
        var db = await openOfflineDb();
        var active = await idbRequest(db.transaction("meta", "readonly").objectStore("meta").get("activeWorkspace"));
        if (!active || !active.workspaceKey) { db.close(); return; }
        var snapshots = await idbRequest(db.transaction("snapshots", "readonly").objectStore("snapshots").getAll());
        var outbox = await idbRequest(db.transaction("outbox", "readonly").objectStore("outbox").getAll());
        db.close();
        var latest = snapshots
          .filter(function (item) { return item.workspaceKey === active.workspaceKey; })
          .sort(function (a, b) { return String(b.updatedAt).localeCompare(String(a.updatedAt)); })[0];
        if (!latest || !Array.isArray(latest.reviews) || !latest.reviews.length) return;
        var section = document.getElementById("snapshot");
        var list = document.getElementById("reviewList");
        document.getElementById("snapshotMeta").textContent = latest.day + " · 缓存 " + latest.reviews.length + " 项";
        var pending = outbox.filter(function (item) { return item.workspaceKey === active.workspaceKey; }).length;
        document.getElementById("pendingMeta").textContent = pending ? "待联网同步 " + pending + " 条" : "无待同步评分";
        latest.reviews.forEach(function (review) {
          var card = document.createElement("article");
          card.className = "reviewCard";
          var title = document.createElement("strong");
          title.textContent = String(review.title || "未命名知识点");
          var meta = document.createElement("span");
          meta.textContent = [review.subject_code, review.tier_name].filter(Boolean).join(" · ");
          var prompt = document.createElement("p");
          prompt.textContent = String(review.prompt || review.title || "");
          var details = document.createElement("details");
          var summary = document.createElement("summary");
          summary.textContent = "核对答案";
          var answer = document.createElement("div");
          answer.textContent = String(review.answer || "未保存参考答案");
          details.append(summary, answer);
          card.append(title, meta, prompt, details);
          list.append(card);
        });
        section.hidden = false;
      } catch (error) {
        console.warn("本机复习快照读取失败", error);
      }
    }

    function openOfflineDb() {
      return new Promise(function (resolve, reject) {
        var request = indexedDB.open("ascend-learning", 3);
        request.onupgradeneeded = function () {
          var db = request.result;
          if (!db.objectStoreNames.contains("outbox")) db.createObjectStore("outbox", { keyPath: "operationId" });
          if (!db.objectStoreNames.contains("snapshots")) db.createObjectStore("snapshots", { keyPath: "key" });
          if (!db.objectStoreNames.contains("meta")) db.createObjectStore("meta", { keyPath: "key" });
        };
        request.onsuccess = function () { resolve(request.result); };
        request.onerror = function () { reject(request.error); };
      });
    }

    function idbRequest(request) {
      return new Promise(function (resolve, reject) {
        request.onsuccess = function () { resolve(request.result); };
        request.onerror = function () { reject(request.error); };
      });
    }
    loadSnapshot();
  </script>
</main></body>
</html>
